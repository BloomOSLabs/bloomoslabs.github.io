<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting…</title>

    <script>
        const path = window.location.pathname + window.location.search + window.location.hash;

        sessionStorage.setItem("redirect", path);

        window.location.replace("/");
    </script>
</head>

</body>
</html>
